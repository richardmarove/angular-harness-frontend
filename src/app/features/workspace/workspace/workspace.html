<div class="flex flex-col h-screen bg-surface text-[#282828] overflow-hidden font-sans select-none">

  <!-- Session setup overlay (shown when no session is active) -->
  @if (!sessionService.isConfigured()) {
    <app-session-setup />
  }

  <!-- Header / Top Bar -->
  <header class="flex items-center justify-between px-4 h-12 border-b border-[#d5c4a1] bg-surface-2 shrink-0 z-20">

    <!-- Left Section: Logo + Explorer Toggle + Active Session Badge -->
    <div class="flex items-center gap-3">
      <!-- Toggle File Explorer -->
      <button
        id="toggle-sidebar"
        (click)="toggleSidebar()"
        title="Toggle File Explorer (Ctrl+B)"
        class="p-1.5 rounded-lg text-text-muted hover:text-[#282828] hover:bg-[#ebdbb2] transition-all flex items-center justify-center border border-transparent hover:border-[#d5c4a1]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
        </svg>
      </button>

      <!-- App Branding Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 rounded-md bg-[#282828] text-surface flex items-center justify-center font-mono font-bold text-xs">
          &lt;/&gt;
        </div>
        <span class="text-xs font-bold tracking-tight text-[#282828]">
          angular-harness
        </span>
        <span class="text-[9px] font-mono px-1.5 py-0.5 rounded badge-neutral font-medium">
          v2.0
        </span>
      </div>

      <!-- Divider -->
      <div class="h-4 w-px bg-[#d5c4a1] mx-1"></div>

      <!-- Active Session Directory Badge -->
      @if (sessionService.isConfigured()) {
        <div class="flex items-center gap-2 px-2.5 py-1 rounded-md bg-[#ebdbb2] border border-[#d5c4a1]">
          <div class="w-2 h-2 rounded-full bg-[#79740e]"></div>
          <span class="text-[11px] text-text-muted font-mono truncate max-w-64" [title]="sessionService.workingDir()">
            {{ sessionService.workingDir() }}
          </span>
          <button
            (click)="changeSession()"
            title="Disconnect or switch working directory"
            class="text-text-muted hover:text-[#9d0006] transition-colors ml-1 p-0.5 rounded hover:bg-[#fbd6d6] flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
    </div>

    <!-- Right Section: AI Assistant Toggle & Status -->
    <div class="flex items-center gap-3">
      <!-- AI Chat Toggle Button -->
      <button
        id="toggle-chat"
        (click)="toggleChat()"
        title="Toggle AI Coding Assistant"
        class="flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-semibold transition-all border"
        [class.bg-[#076678]]="chatOpen()"
        [class.text-[#fbf1c7]]="chatOpen()"
        [class.border-[#076678]]="chatOpen()"
        [class.text-[#7c6f64]]="!chatOpen()"
        [class.border-transparent]="!chatOpen()"
        [class.hover:bg-[#ebdbb2]]="!chatOpen()">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
        </svg>
        <span>AI Assistant</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout (Explorer Sidebar | Code Editor | AI Chat Assistant) -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- File Explorer Sidebar -->
    @if (sidebarOpen()) {
      <aside class="w-60 shrink-0 border-r border-[#d5c4a1] bg-surface-2 overflow-hidden flex flex-col transition-all">
        <app-file-tree />
      </aside>
    }

    <!-- Main Editor Panel -->
    <main class="flex-1 overflow-hidden flex flex-col bg-surface">
      <app-editor-panel />
    </main>

    <!-- AI Assistant Chat Panel -->
    @if (chatOpen()) {
      <aside class="w-96 shrink-0 border-l border-[#d5c4a1] bg-surface-2 overflow-hidden flex flex-col transition-all">
        <app-chat-panel />
      </aside>
    }

  </div>
</div>
