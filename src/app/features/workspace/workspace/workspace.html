<div class="flex flex-col h-screen bg-[var(--color-surface)] overflow-hidden">

  <!-- Session setup overlay (shown when no session is active) -->
  @if (!sessionService.isConfigured()) {
    <app-session-setup />
  }

  <!-- Top bar -->
  <header class="flex items-center justify-between px-4 h-11 border-b border-[var(--color-border)] bg-[var(--color-surface-2)] flex-shrink-0 z-10">
    <!-- Left: logo + sidebar toggle -->
    <div class="flex items-center gap-3">
      <button id="toggle-sidebar" (click)="toggleSidebar()" title="Toggle explorer"
        class="p-1.5 rounded text-[var(--color-text-muted)] hover:text-[var(--color-text)] hover:bg-[var(--color-surface-3)] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-5 h-5 rounded bg-[var(--color-accent)] flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        </div>
        <span class="text-sm font-semibold text-[var(--color-text)]">CodeAgent</span>
      </div>

      <!-- Active session indicator -->
      @if (sessionService.isConfigured()) {
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[var(--color-surface-3)] border border-[var(--color-border)]">
          <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
          <span class="text-[11px] text-[var(--color-text-muted)] font-mono truncate max-w-48"
            [title]="sessionService.workingDir()">
            {{ sessionService.workingDir() }}
          </span>
          <button (click)="changeSession()" title="Change session"
            class="text-[var(--color-text-muted)] hover:text-red-400 transition-colors ml-1 leading-none text-base">
            ×
          </button>
        </div>
      }
    </div>

    <!-- Right: chat toggle -->
    <button id="toggle-chat" (click)="toggleChat()" title="Toggle AI chat"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium transition-colors"
      [class.bg-[var(--color-accent-muted)]]="chatOpen()"
      [class.text-[var(--color-accent)]]="chatOpen()"
      [class.text-[var(--color-text-muted)]]="!chatOpen()"
      [class.hover:bg-[var(--color-surface-3)]]="!chatOpen()">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
      </svg>
      AI Chat
    </button>
  </header>

  <!-- Main content: sidebar | editor | chat -->
  <div class="flex flex-1 overflow-hidden">

    <!-- File explorer sidebar -->
    @if (sidebarOpen()) {
      <aside class="w-56 flex-shrink-0 border-r border-[var(--color-border)] overflow-hidden">
        <app-file-tree />
      </aside>
    }

    <!-- Editor panel -->
    <main class="flex-1 overflow-hidden">
      <app-editor-panel />
    </main>

    <!-- Chat panel -->
    @if (chatOpen()) {
      <aside class="w-80 flex-shrink-0 border-l border-[var(--color-border)] overflow-hidden">
        <app-chat-panel />
      </aside>
    }

  </div>
</div>
