<!-- Tool event row — collapsible -->
<div class="my-1 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface-3)] overflow-hidden text-xs font-mono">

  <!-- Header (always visible) -->
  <button
    (click)="toggle()"
    class="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-[var(--color-surface-4)] transition-colors">

    <!-- Spinner or chevron -->
    @if (isStreaming) {
      <svg class="w-3 h-3 animate-spin flex-shrink-0 text-[var(--color-accent)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 flex-shrink-0 text-[var(--color-text-muted)] transition-transform"
        [class.rotate-90]="expanded()"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    }

    <!-- Tool name badge -->
    <span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider"
      [class.bg-indigo-500/20]="!toolError"
      [class.text-indigo-300]="!toolError"
      [class.bg-red-500/20]="toolError"
      [class.text-red-300]="toolError">
      {{ toolName }}
    </span>

    <!-- Args preview -->
    @if (argsPreview && !expanded()) {
      <span class="text-[var(--color-text-muted)] truncate">{{ argsPreview }}</span>
    }

    <!-- Status icon -->
    <span class="ml-auto flex-shrink-0">
      @if (isStreaming) {
        <span class="text-[var(--color-text-muted)]">running…</span>
      } @else if (toolError) {
        <span class="text-red-400">✗ error</span>
      } @else if (toolResult) {
        <span class="text-emerald-400">✓ done</span>
      }
    </span>
  </button>

  <!-- Expanded body -->
  @if (expanded()) {
    <div class="border-t border-[var(--color-border)] divide-y divide-[var(--color-border)]">

      <!-- Args section -->
      @if (toolArgs && (toolArgs | keyvalue).length > 0) {
        <div class="px-3 py-2">
          <div class="text-[10px] text-[var(--color-text-muted)] uppercase tracking-wider mb-1">Arguments</div>
          @for (entry of toolArgs | keyvalue; track entry.key) {
            <div class="flex gap-2">
              <span class="text-[var(--color-accent-hover)]">{{ entry.key }}:</span>
              <span class="text-[var(--color-text-muted)] truncate">{{ entry.value }}</span>
            </div>
          }
        </div>
      }

      <!-- Result section -->
      @if (toolResult || toolError) {
        <div class="px-3 py-2">
          <div class="text-[10px] uppercase tracking-wider mb-1"
            [class.text-emerald-400]="!toolError"
            [class.text-red-400]="toolError">
            {{ toolError ? 'Error' : 'Result' }}
          </div>
          <pre class="text-[var(--color-text-muted)] whitespace-pre-wrap break-all leading-relaxed max-h-48 overflow-y-auto">{{ toolError || toolResult }}</pre>
        </div>
      }
    </div>
  }
</div>
