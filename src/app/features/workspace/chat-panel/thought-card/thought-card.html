<div class="my-1.5 rounded-lg border border-[#d5c4a1] bg-surface overflow-hidden text-xs font-mono">

  <button
    (click)="toggle()"
    class="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-[#ebdbb2]/50 transition-colors">

    @if (isStreaming) {
      <svg class="w-3.5 h-3.5 animate-spin shrink-0 text-[#076678]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0 text-text-muted transition-transform duration-200"
        [class.rotate-90]="expanded()"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    }

    <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider badge-aqua">
      Reasoning
    </span>

    <span class="ml-auto shrink-0 text-[10px] font-semibold">
      @if (isStreaming) {
        <span class="text-[#076678] animate-pulse">Thinking…</span>
      } @else {
        <span class="text-text-muted font-mono">Done</span>
      }
    </span>
  </button>

  @if (expanded()) {
    <div class="border-t border-[#d5c4a1] bg-surface-2/60 p-3">
      <p class="text-[11px] text-text-muted italic whitespace-pre-wrap leading-relaxed m-0">{{ content }}</p>
    </div>
  }
</div>
