<div class="flex flex-col h-full bg-[var(--color-surface)]">

  <!-- Tab bar -->
  <div class="flex items-center border-b border-[var(--color-border)] bg-[var(--color-surface-2)] overflow-x-auto">
    @for (tab of tabs(); track tab) {
      <div
        class="flex items-center gap-2 px-4 py-2.5 text-xs cursor-pointer border-r border-[var(--color-border)] flex-shrink-0 transition-colors group"
        [class.bg-[var(--color-surface)]]="activeTab() === tab"
        [class.border-t-2]="activeTab() === tab"
        [class.border-t-[var(--color-accent)]]="activeTab() === tab"
        [class.text-[var(--color-text)]]="activeTab() === tab"
        [class.text-[var(--color-text-muted)]]="activeTab() !== tab"
        [class.hover:bg-[var(--color-surface-3)]]="activeTab() !== tab"
        (click)="selectTab(tab)">
        <span>{{ tab }}</span>
        <button
          (click)="closeTab(tab, $event)"
          class="opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity text-[var(--color-text-muted)] leading-none">
          ×
        </button>
      </div>
    }
    @if (tabs().length === 0) {
      <div class="px-4 py-2.5 text-xs text-[var(--color-text-muted)] italic">No files open</div>
    }
  </div>

  <!-- Editor area -->
  <div class="flex-1 overflow-auto p-4">
    @if (tabs().length > 0) {
      <!-- Placeholder — swap this div for <ngx-monaco-editor> -->
      <pre class="text-sm leading-relaxed text-[var(--color-text-muted)] font-mono whitespace-pre-wrap m-0"
        style="font-family: var(--font-mono);">{{ placeholderCode() }}</pre>
    } @else {
      <!-- Empty state -->
      <div class="h-full flex flex-col items-center justify-center gap-4 opacity-40">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-[var(--color-border)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
        <p class="text-sm text-[var(--color-text-muted)]">Open a file to start editing</p>
      </div>
    }
  </div>

  <!-- Status bar -->
  <div class="flex items-center justify-between px-4 py-1 bg-[var(--color-surface-2)] border-t border-[var(--color-border)] text-[10px] text-[var(--color-text-muted)]">
    <span>TypeScript</span>
    <span class="flex items-center gap-3">
      <span>Ln 1, Col 1</span>
      <span>UTF-8</span>
      <span class="text-[var(--color-accent)]">✓ Ready</span>
    </span>
  </div>
</div>
