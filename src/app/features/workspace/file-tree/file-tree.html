<div class="flex flex-col h-full bg-[var(--color-surface-2)] select-none">
  <!-- Header -->
  <div class="px-3 py-2.5 border-b border-[var(--color-border)] flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[var(--color-text-muted)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
    </svg>
    <span class="text-xs font-semibold text-[var(--color-text-muted)] uppercase tracking-wider">Explorer</span>
  </div>

  <!-- Tree -->
  <div class="flex-1 overflow-y-auto py-2">
    <ng-container *ngTemplateOutlet="treeNodes; context: { nodes: tree(), depth: 0 }"></ng-container>
  </div>

  <ng-template #treeNodes let-nodes="nodes" let-depth="depth">
    @for (node of nodes; track node.name) {
      <div
        class="flex items-center gap-1.5 px-2 py-1 cursor-pointer text-sm rounded mx-1 transition-colors"
        [style.padding-left.px]="12 + depth * 12"
        [class.bg-[var(--color-accent-muted)]]="selectedFile() === node.name"
        [class.text-[var(--color-accent)]]="selectedFile() === node.name"
        [class.text-[var(--color-text)]]="selectedFile() !== node.name"
        [class.hover:bg-[var(--color-surface-3)]]="selectedFile() !== node.name"
        (click)="selectFile(node)">

        <!-- Folder chevron -->
        @if (node.type === 'folder') {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 flex-shrink-0 text-[var(--color-text-muted)] transition-transform"
            [class.rotate-90]="node.expanded"
            fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        } @else {
          <span class="w-3 flex-shrink-0"></span>
        }

        <!-- Icon -->
        <span class="text-xs leading-none">
          @if (node.type === 'folder') {
            {{ node.expanded ? '📂' : '📁' }}
          } @else {
            {{ getFileIcon(node.name) }}
          }
        </span>

        <!-- Name -->
        <span class="truncate text-xs">{{ node.name }}</span>
      </div>

      <!-- Children -->
      @if (node.type === 'folder' && node.expanded && node.children) {
        <ng-container *ngTemplateOutlet="treeNodes; context: { nodes: node.children, depth: depth + 1 }"></ng-container>
      }
    }
  </ng-template>
</div>
